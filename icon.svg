<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Espresso to Warm Walnut) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0c" />
      <stop offset="45%" stop-color="#1e1814" />
      <stop offset="100%" stop-color="#2a201b" />
    </linearGradient>

    <!-- Deceased Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Heir Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows for Nodes -->
    <filter id="goldGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#d97706" flood-opacity="0.45" />
    </filter>
    <filter id="emeraldGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#059669" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="#57483e" stroke-width="3.5" stroke-opacity="0.75" />

  <!-- Orthogonal Family Tree Connection Lines (Warm Amber Bronze) -->
  <g stroke="#d97706" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Vertical Drop from Deceased Parent -->
    <path d="M 256 210 L 256 256" />
    <!-- Horizontal Bus Bar with Continuous Right-Angled Drops to Children -->
    <path d="M 144 310 L 144 256 L 368 256 L 368 310" />
  </g>

  <!-- Bus Central Distribution Point -->
  <circle cx="256" cy="256" r="6" fill="#fbbf24" />

  <!-- 1. Root Deceased Person Node (Amber Gold) -->
  <g transform="translate(256, 150)" filter="url(#goldGlow)">
    <circle r="60" fill="url(#goldGrad)" />
    <!-- Person Silhouette -->
    <circle cx="0" cy="-16" r="19" fill="#140f0c" />
    <path d="M -30 30 C -30 11 -16 2 0 2 C 16 2 30 11 30 30 Z" fill="#140f0c" />
  </g>

  <!-- 2. Heir Child Node 1 (Emerald Green) -->
  <g transform="translate(144, 360)" filter="url(#emeraldGlow)">
    <circle r="50" fill="url(#emeraldGrad)" />
    <!-- Person Silhouette -->
    <circle cx="0" cy="-14" r="16" fill="#140f0c" />
    <path d="M -25 25 C -25 9 -13 2 0 2 C 13 2 25 9 25 25 Z" fill="#140f0c" />
  </g>

  <!-- 3. Heir Child Node 2 (Emerald Green) -->
  <g transform="translate(368, 360)" filter="url(#emeraldGlow)">
    <circle r="50" fill="url(#emeraldGrad)" />
    <!-- Person Silhouette -->
    <circle cx="0" cy="-14" r="16" fill="#140f0c" />
    <path d="M -25 25 C -25 9 -13 2 0 2 C 13 2 25 9 25 25 Z" fill="#140f0c" />
  </g>
</svg>
