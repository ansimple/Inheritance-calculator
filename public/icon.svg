<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Tree Connection Lines -->
  <path d="M 256 180 L 256 240 M 140 240 L 372 240 M 140 240 L 140 300 M 372 240 L 372 300" 
        stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Root Deceased Node -->
  <g transform="translate(256, 140)">
    <circle r="46" fill="url(#goldGrad)" filter="drop-shadow(0 8px 16px rgba(245, 158, 11, 0.4))" />
    <path d="M -16 -6 A 16 16 0 1 1 16 -6 A 16 16 0 1 1 -16 -6 M -24 28 C -24 14 -12 6 0 6 C 12 6 24 14 24 28 Z" fill="#0f172a" />
  </g>

  <!-- Child Node 1 -->
  <g transform="translate(140, 330)">
    <circle r="38" fill="url(#primaryGrad)" filter="drop-shadow(0 6px 12px rgba(2, 132, 199, 0.3))" />
    <path d="M -13 -5 A 13 13 0 1 1 13 -5 A 13 13 0 1 1 -13 -5 M -20 23 C -20 11 -10 5 0 5 C 10 5 20 11 20 23 Z" fill="#ffffff" />
  </g>

  <!-- Child Node 2 -->
  <g transform="translate(372, 330)">
    <circle r="38" fill="url(#primaryGrad)" filter="drop-shadow(0 6px 12px rgba(2, 132, 199, 0.3))" />
    <path d="M -13 -5 A 13 13 0 1 1 13 -5 A 13 13 0 1 1 -13 -5 M -20 23 C -20 11 -10 5 0 5 C 10 5 20 11 20 23 Z" fill="#ffffff" />
  </g>

  <!-- Balance Scales / Distribution Symbol at Bottom Center -->
  <g transform="translate(256, 420)">
    <path d="M -60 0 L 60 0 M 0 -18 L 0 16 M -40 24 L 40 24" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <circle cx="-40" cy="10" r="14" fill="none" stroke="#38bdf8" stroke-width="4" />
    <circle cx="40" cy="10" r="14" fill="none" stroke="#38bdf8" stroke-width="4" />
  </g>
</svg>
